<!DOCTYPE html>

<head>
  <title>Bookmarks</title>

  <style>
    
    .social {
      width: 47px;
      height: 47px;
      border-radius: 50%;
      margin: 3px;
      cursor: pointer;
    }

    .icon {
      width: 1.2em;
      padding-left: 10px;
      padding-bottom: 10px;
      padding-right: 10px;
      padding-top: 10px; 
    }
    
    div.scroll {
  		overflow: auto;
  		white-space: nowrap;
    	padding: 5px;
	}
    
    div.scroll a {

    }

  </style>

</head>

<body>

  <body>

    <div class="scroll">
